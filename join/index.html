<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Trip — Triply</title>
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <meta name="theme-color" content="#0B0F13">
    <meta name="description" content="Join your friends on Triply and plan your trips, split expenses, and travel together.">
    <style>
        :root {
            --primary: #23C063;
            --primary-hover: #1FAA56;
            --bg-dark: #0B0F13;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(35, 192, 99, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 44px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }

        .icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(35, 192, 99, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(35, 192, 99, 0.12);
            color: var(--primary);
            border: 1px solid rgba(35, 192, 99, 0.25);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        .code-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(35, 192, 99, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: none;
        }

        .code-box.visible {
            display: block;
        }

        .code-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .code-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.1em;
            word-break: break-all;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .input-group input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: #051A0D;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(35, 192, 99, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            margin-top: 12px;
            font-weight: 600;
            font-size: 14px;
            padding: 14px 20px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: none;
            transform: none;
        }

        .footer-links {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            justify-content: center;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <img src="/assets/icon.png" alt="Triply App Icon">
        </div>
        
        <div class="badge">✈️ TRIP INVITATION</div>
        <h1 id="title">You've Been Invited!</h1>
        <p id="subtitle">Join this trip on Triply to collaborate on the itinerary, split expenses, and explore together.</p>

        <div id="code-card" class="code-box">
            <div class="code-label">Trip Code</div>
            <div id="code-display" class="code-val">-</div>
        </div>

        <div id="manual-input-section" style="display: none;">
            <div class="input-group">
                <input type="text" id="manual-code" placeholder="Enter 6-digit trip code" autocomplete="off" autocorrect="off">
            </div>
        </div>

        <a id="join-btn" href="triply://join" class="btn">
            <span>Open in Triply App</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

        <a href="/" class="btn btn-secondary">
            Learn More About Triply
        </a>

        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/support">Support</a>
            <a href="/terms-and-conditions">Terms</a>
        </div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code') || '';
            const joinBtn = document.getElementById('join-btn');
            const codeCard = document.getElementById('code-card');
            const codeDisplay = document.getElementById('code-display');
            const manualSection = document.getElementById('manual-input-section');
            const manualCodeInput = document.getElementById('manual-code');

            if (code) {
                codeDisplay.textContent = code;
                codeCard.classList.add('visible');
                joinBtn.href = "triply://join?code=" + encodeURIComponent(code);

                // Auto redirect if on iOS Safari
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    setTimeout(() => {
                        window.location.href = "triply://join?code=" + encodeURIComponent(code);
                    }, 400);
                }
            } else {
                manualSection.style.display = 'block';
                manualCodeInput.addEventListener('input', function(e) {
                    const val = e.target.value.trim();
                    if (val) {
                        joinBtn.href = "triply://join?code=" + encodeURIComponent(val);
                    } else {
                        joinBtn.href = "triply://join";
                    }
                });
            }
        })();
    </script>
</body>
</html>
